<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catacomb Map - etinuXe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0c0c0c;
            color: #ffffff;
            zoom: 67%;
            overflow: hidden;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 48px;
            margin-bottom: 8px;
            color: #8654d8;
        }
        .header p {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.7);
        }
        .map-container {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            margin-bottom: 20px;
        }
        #map3d {
            width: 100%;
            height: 100%;
        }
        .legend {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 8px;
        }
        .legend h3 {
            font-size: 16px;
            margin-bottom: 12px;
            color: #8654d8;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }
        .controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 16px;
            border-radius: 8px;
            font-size: 14px;
        }
        .back-button {
            display: inline-block;
            padding: 12px 24px;
            background: rgba(134, 84, 216, 0.1);
            border: 1px solid #8654d8;
            border-radius: 8px;
            color: #ffffff;
            text-decoration: none;
            transition: background 0.2s;
        }
        .back-button:hover {
            background: rgba(134, 84, 216, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Catacomb Map</h1>
            <p>3D Underground City Navigation</p>
        </div>

        <div class="map-container">
            <canvas id="map3d"></canvas>

            <div class="legend">
                <h3>Safety Zones</h3>
                <div class="legend-item">
                    <div class="legend-color" style="background: #4444ff;"></div>
                    <span>Safe Zone</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #ff9944;"></div>
                    <span>Cautious</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #ff4444;"></div>
                    <span>Danger</span>
                </div>
            </div>

            <div class="controls">
                <div>Mouse: Rotate view</div>
                <div>Scroll: Zoom</div>
            </div>
        </div>

        <a href="index.html" class="back-button">← Back to Home</a>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const canvas = document.getElementById('map3d');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);

        const camera = new THREE.PerspectiveCamera(75, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
        camera.position.set(20, 20, 20);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(canvas.clientWidth, canvas.clientHeight);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
        directionalLight.position.set(10, 10, 10);
        scene.add(directionalLight);

        const gridHelper = new THREE.GridHelper(40, 40, 0x444444, 0x222222);
        scene.add(gridHelper);

        function createZone(x, y, z, width, height, depth, color, name) {
            const geometry = new THREE.BoxGeometry(width, height, depth);
            const material = new THREE.MeshStandardMaterial({
                color: color,
                transparent: true,
                opacity: 0.6,
                metalness: 0.5,
                roughness: 0.5
            });
            const cube = new THREE.Mesh(geometry, material);
            cube.position.set(x, y, z);

            const edges = new THREE.EdgesGeometry(geometry);
            const line = new THREE.LineSegments(
                edges,
                new THREE.LineBasicMaterial({ color: color })
            );
            line.position.copy(cube.position);

            scene.add(cube);
            scene.add(line);

            return cube;
        }

        function createCorridor(x1, z1, x2, z2) {
            const length = Math.sqrt((x2-x1)**2 + (z2-z1)**2);
            const angle = Math.atan2(z2-z1, x2-x1);

            const geometry = new THREE.BoxGeometry(length, 0.5, 1);
            const material = new THREE.MeshStandardMaterial({
                color: 0x555555,
                metalness: 0.3,
                roughness: 0.7
            });
            const corridor = new THREE.Mesh(geometry, material);
            corridor.position.set((x1+x2)/2, 0.25, (z1+z2)/2);
            corridor.rotation.y = angle;
            scene.add(corridor);
        }

        createZone(-8, 2, -8, 6, 4, 6, 0x4444ff, 'Safe Zone A');
        createZone(8, 2, -8, 5, 4, 5, 0x4444ff, 'Safe Zone B');
        createZone(-8, 2, 8, 5, 4, 5, 0xff9944, 'Cautious Area');
        createZone(8, 2, 8, 6, 4, 6, 0xff4444, 'Danger Zone');
        createZone(0, 1.5, 0, 4, 3, 4, 0x8654d8, 'Hub');

        createCorridor(-8, -8, 0, 0);
        createCorridor(8, -8, 0, 0);
        createCorridor(-8, 8, 0, 0);
        createCorridor(8, 8, 0, 0);

        let mouseDown = false;
        let mouseX = 0;
        let mouseY = 0;

        canvas.addEventListener('mousedown', (e) => {
            mouseDown = true;
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        canvas.addEventListener('mouseup', () => {
            mouseDown = false;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!mouseDown) return;

            const deltaX = e.clientX - mouseX;
            const deltaY = e.clientY - mouseY;

            camera.position.applyAxisAngle(new THREE.Vector3(0, 1, 0), deltaX * 0.005);

            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 1.1 : 0.9;
            camera.position.multiplyScalar(delta);
        });

        window.addEventListener('resize', () => {
            camera.aspect = canvas.clientWidth / canvas.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(canvas.clientWidth, canvas.clientHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
